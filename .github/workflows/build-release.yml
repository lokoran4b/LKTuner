name: Build and Release LKTuner APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build-Tools y Plataforma Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar APK con build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: LKTuner-apk
          path: LKTuner.apk
          if-no-files-found: error

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'LKTuner Latest Build' }}
          draft: false
          prerelease: false
          files: LKTuner.apk
          body: |
            ### 🎸 LKTuner - Afinador de Guitarra PRO
            Compilación automatizada continua de LKTuner para Android.
            
            - **Descarga directa:** [LKTuner.apk](https://github.com/lokoran4b/LKTuner/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}/LKTuner.apk)
            - **Sin anuncios, sin rastreadores y sin compras integradas.**
            - **Requisitos:** Android 8.0 o superior (API 26+).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
